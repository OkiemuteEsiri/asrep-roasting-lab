name: security-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic assessment
        run: python -m src.cli data/synthetic_accounts.json --output /tmp/asrep-assessment.md
      - name: Validate report markers
        run: |
          grep -q "T1558.004" /tmp/asrep-assessment.md
          grep -q "Closure standard" /tmp/asrep-assessment.md
